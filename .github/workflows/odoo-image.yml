# Builds the Odoo image that Railway runs, and publishes it to this
# repository's GitHub Container Registry.
#
# Why this exists rather than Railway building from the repo directly:
# Railway's GitHub connection on this account cannot read any repository —
# not even a public one it is already deploying — so attaching a repo to a
# service fails with "User does not have access to the repo". A container
# image needs no such link: Railway pulls it straight from the registry.
#
# The image is therefore built here, where the GitHub credentials are
# already valid, and Railway's Odoo service points at the published tag.
name: Odoo image

on:
  push:
    branches: [main]
    paths:
      - "odoo/**"
      - ".github/workflows/odoo-image.yml"
  workflow_dispatch:

concurrency:
  group: odoo-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The build context is odoo/, so the Dockerfile's `COPY addons/`
          # resolves without dragging the Next.js app into the image.
          context: ./odoo
          file: ./odoo/Dockerfile
          push: true
          # Railway is pointed at :latest and redeployed to pick up a build;
          # the commit tag is what makes a specific build identifiable and
          # a rollback possible.
          tags: |
            ghcr.io/${{ github.repository_owner }}/kakitahi-odoo:latest
            ghcr.io/${{ github.repository_owner }}/kakitahi-odoo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Where it landed
        run: |
          echo "ghcr.io/${{ github.repository_owner }}/kakitahi-odoo:latest"
          echo "ghcr.io/${{ github.repository_owner }}/kakitahi-odoo:${{ github.sha }}"
